gemini:
  api_key: ${GEMINI_API_KEY}
  gen_ai_model: "gemini-3.8-flash"

slack:
  api_token: ${SLACK_API_TOKEN}
  default_channel_id: "C0B1DQV79LN"

conferences:
  urls:
    - "https://dblp.org/db/conf/osdi/index.html"
    - "https://dblp.org/db/conf/sosp/index.html"
    - "https://dblp.org/db/conf/asplos/index.html"
    - "https://dblp.org/db/conf/nsdi/index.html"
    - "https://dblp.org/db/conf/eurosys/index.html"
    - "https://dblp.org/db/conf/cloud/index.html"
    - "https://dblp.org/db/conf/mlsys/index.html"
    - "https://dblp.org/db/conf/isca/index.html"
    - "https://dblp.org/db/conf/micro/index.html"
    - "https://dblp.org/db/conf/hpca/index.html"
    - "https://dblp.org/db/conf/hotos/index.html"
    - "https://dblp.org/db/conf/hotcarbon/index.html"
    - "https://dblp.org/db/conf/words2/index.html"
    - "https://dblp.org/db/conf/sesame/index.html"
  max_volumes: 5
  volume_date_filter_days: 30
  semantic_scholar_api_key: ${SEMANTIC_SCHOLAR_API_KEY}

research_topics:
  - name: "LLM Inference"
    keywords:
      - "llm inference"
      - "llm serving"
      - "scheduling"
      - "batching"
      - "kv cache"
      - "quantization"
      - "offloading"
    description: >-
      Systems or measured execution-efficiency contributions to large language
      model inference and serving, including scheduling, batching, kernels,
      memory and KV caches, quantization, offloading, parallel execution,
      deployment, and systems measurement. Training alone and merely using an
      LLM for another problem are insufficient. Multimodal or agent papers
      qualify only if their actual contribution directly optimizes or
      characterizes LLM inference execution.
    taxonomy:
      - "LLM inference scheduling and batching"
      - "Inference kernels and parallel execution"
      - "Memory management and KV cache optimization"
      - "Quantization and offloading for inference"
      - "LLM serving, deployment, and systems measurement"

  - name: "Serverless Computing"
    keywords:
      - "serverless"
      - "FaaS"
      - "function-as-a-service"
      - "cold start"
      - "elasticity"
      - "serverless scheduling"
    description: >-
      Systems for serverless and Function-as-a-Service execution and associated
      cloud-native function or workflow architectures, including cold starts,
      elasticity, isolation, resource sharing, lifecycle management, scheduling,
      and programming or execution abstractions. Generic cloud, containers,
      distributed systems, and classic systems research are not automatically
      serverless.
    taxonomy:
      - "Serverless and FaaS execution architectures"
      - "Cold starts and function lifecycle management"
      - "Elasticity, isolation, and resource sharing"
      - "Scheduling and resource management for serverless workloads"
      - "Serverless programming and execution abstractions"

  - name: "Agentic Execution Environment"
    keywords:
      - "AI agent runtime"
      - "agent execution"
      - "sandbox"
      - "tool execution"
      - "agent orchestration"
      - "checkpointing"
      - "agent workflow"
    description: >-
      Systems enabling the execution of AI agents, including tool and OS
      interfaces, sandboxes, runtime authorization and isolation, checkpointing,
      state management, orchestration, workflow scheduling, and resource
      management of agent trajectories. Includes execution substrates used
      during agent learning. Agent applications, model alignment, planning
      accuracy, and ordinary non-AI software agents alone are insufficient.
    taxonomy:
      - "AI agent runtimes and execution environments"
      - "Tool and operating-system interfaces for agents"
      - "Agent sandboxing, authorization, and isolation"
      - "Agent checkpointing and state management"
      - "Agent orchestration, workflow scheduling, and resource management"
      - "Execution substrates for agent learning"

  - name: "Video & Embodied Intelligence"
    keywords:
      - "vision-language model"
      - "VLM"
      - "video understanding"
      - "video generation"
      - "visual world model"
      - "vision-language-action"
      - "embodied AI"
    description: >-
      Systems and measured execution-efficiency contributions for vision-language
      models, including image-capable VLMs, video understanding, retrieval and
      generation, visual world models, vision-language-action models, and
      embodied workloads. Relevant contributions include serving, decoding,
      deployment, scheduling, memory and caching, communication, hardware,
      real-time execution, and control-loop efficiency. Capability or accuracy
      improvements alone, generic multimodal training, image-only diffusion,
      rendering alone, and video network transport alone are outside scope.
    taxonomy:
      - "VLM serving and inference efficiency"
      - "Video understanding, retrieval, and generation systems"
      - "Visual world model execution systems"
      - "Vision-language-action and embodied workload execution"
      - "Scheduling, memory, caching, and hardware for visual workloads"
      - "Real-time inference and embodied control-loop efficiency"

  - name: "Sustainable Computing"
    keywords:
      - "energy efficiency"
      - "power efficiency"
      - "carbon-aware scheduling"
      - "carbon footprint"
      - "data center energy"
      - "embodied carbon"
    description: >-
      Systems research explicitly targeting computing energy or power efficiency,
      or environmental and carbon reduction. Includes energy-aware hardware and
      runtime configurations, carbon-aware scheduling, data-center power
      reduction, and embodied-carbon reduction. Relevant energy or environmental
      evidence is required. Lower latency, FLOPs, memory use, monetary cost, or
      GPU count alone does not establish this topic. Explicit energy-performance
      trade-offs are allowed.
    taxonomy:
      - "Energy-aware computing hardware and runtime configurations"
      - "Carbon-aware scheduling and workload placement"
      - "Data-center power and energy reduction"
      - "Computing embodied-carbon reduction"
      - "Measured energy-performance trade-offs"
