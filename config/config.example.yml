---
email:
  username: ${GMAIL_USERNAME}
  password: ${GMAIL_APP_PASSWORD}
  folder: "Google Scholar Alerts"

slack:
  api_token: ${SLACK_API_TOKEN}
  default_channel: "scholar-scout-default"
  pending_user_id: "U0618BHHTRR" # Yulin; pending reports are sent only by DM.

gemini:
  api_key: ${GEMINI_API_KEY}
  gen_ai_model: "gemini-3.8-flash"

state_storage:
  branch: "scholar-state"
  file: "state.json"

state_dir: ".scholar-scout"

pending_policy:
  max_attempts: 5 # Includes the first processing attempt; deferred retries do not count.
  max_age_days: 30 # Measured from first entering the queue, not publication date.

source_recovery:
  max_rounds: 2 # Shared across all papers in a run, after trying alternative sources.
  max_wait_seconds: 180 # Total recovery waiting budget for the run.

