name: Weekly Scholar Classifier

on:
  schedule:
    - cron: '0 0 * * MON'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-production-state
  cancel-in-progress: false

jobs:
  run-classifier:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ABSTRACT_CACHE_KEY: scholar-abstracts-v2-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create config files from template
      run: cp config/config.example.yml config/config.yml

    - name: Restore pending state
      id: restore_state
      env:
        GH_TOKEN: ${{ github.token }}
      run: python scripts/scholar_state.py restore

    - name: Restore abstract cache
      id: restore_cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.restore_state.outputs.state_dir }}/abstracts/*.json
        key: ${{ env.ABSTRACT_CACHE_KEY }}
        restore-keys: scholar-abstracts-v2-

    - name: Report abstract cache restoration
      env:
        CACHE_OUTCOME: ${{ steps.restore_cache.outcome }}
        CACHE_KEY: ${{ steps.restore_cache.outputs.cache-matched-key }}
      run: |
        if [ "$CACHE_OUTCOME" = "success" ] && [ -n "$CACHE_KEY" ]; then
          printf 'Abstract cache restored: `%s`.\n' "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"
        else
          echo '::warning::Abstract cache unavailable or missed; abstracts will be fetched again. Pending state was restored independently.'
          echo 'Abstract cache: **unavailable or missed**; pending state is unaffected.' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Run Scholar Classifier
      id: classify
      env:
        GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        SLACK_API_TOKEN: ${{ secrets.SLACK_API_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GOOGLE_CREDENTIALS }}
        IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
        SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      run: python scripts/run_classifier.py

    - name: Save pending state
      id: save_state
      if: always() && steps.restore_state.outcome == 'success' && steps.classify.outcome != 'skipped'
      env:
        GH_TOKEN: ${{ github.token }}
      run: python scripts/scholar_state.py save

    - name: Save abstract cache
      id: save_cache
      if: always() && steps.classify.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.restore_state.outputs.state_dir }}/abstracts/*.json
        key: ${{ env.ABSTRACT_CACHE_KEY }}

    - name: Verify abstract cache
      id: verify_cache
      if: always() && steps.save_cache.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.restore_state.outputs.state_dir }}/abstracts/*.json
        key: ${{ env.ABSTRACT_CACHE_KEY }}
        lookup-only: true

    - name: Report abstract cache persistence
      if: always() && steps.save_cache.outcome != 'skipped'
      env:
        CACHE_OUTCOME: ${{ steps.verify_cache.outcome }}
        CACHE_KEY: ${{ steps.verify_cache.outputs.cache-matched-key }}
      run: |
        if [ "$CACHE_OUTCOME" = "success" ] && [ "$CACHE_KEY" = "$ABSTRACT_CACHE_KEY" ]; then
          echo 'Abstract cache save: **confirmed**.' >> "$GITHUB_STEP_SUMMARY"
        else
          echo '::warning::Abstract cache save was not confirmed; this does not replace or invalidate the pending-state save.'
          echo 'Abstract cache save: **unconfirmed**; see the independent pending-state save result.' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload classification diagnostics
      if: always() && steps.classify.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: scholar-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.restore_state.outputs.state_dir }}/last-run.json
        if-no-files-found: ignore
        retention-days: 30
        include-hidden-files: true
