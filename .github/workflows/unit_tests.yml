name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * MON'  # Runs at 00:00 every Monday
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock
        
    - name: Run offline tests
      run: |
        python -m unittest discover -s tests -p test_email_client.py -v
        python -m unittest discover -s tests -p test_email_deletion.py -v
        python -m unittest discover -s tests -p test_gemini_pipeline.py -v
        python -m unittest discover -s tests -p test_abstract_sources.py -v
        python -m unittest discover -s tests -p test_cache_workflow.py -v
        python -m unittest discover -s tests -p test_slack_notifier.py -v
